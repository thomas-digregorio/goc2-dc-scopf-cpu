[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goc2-dc-scopf-cpu"
version = "0.2.0"
description = "CPU lossless-DC corrective SCOPF benchmark derived from public GO Challenge 2 data"
requires-python = ">=3.11"
dependencies = [
  "highspy>=1.15,<2",
  "jsonschema>=4.23,<5",
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "psutil>=6,<8",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]
hipo = ["highspy[extras]>=1.15,<2"]

[project.scripts]
goc2-dc-scopf = "goc2_dc_scopf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
